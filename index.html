<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <meta name="theme-color" content="#174a7e">

    <link rel="manifest" href="./assets/manifest.json">
    <link rel="icon" href="./assets/images/icon.svg" type="image/svg+xml">

    <title>O³ – OutOfOffice</title>

    <link rel="stylesheet" href="./assets/css/style.css">
</head>


<body>

<main>

    <header>

        <h1 id="title">
            DWD Raumschild
        </h1>

        <div class="header-info">

            <div id="organizationTop">
                Bluetooth-Verbindung zum Raumschild
            </div>

            <div id="departmentTop"></div>

        </div>

    </header>


    <!-- Verbindung + Akku -->

    <section class="panel">

        <div class="connection-row">

            <div
                    id="connectionDot"
                    class="dot">
            </div>

            <button
                    id="connectButton"
                    class="primary">

                Raumschild verbinden

            </button>

        </div>


        <div id="message">
            Bereit zum Verbinden.
        </div>
        <div id="lastConnected"
             class="last-connected">
        </div>


        <div id="batteryPanel">

            <div class="battery-row">

                <span class="battery-label">
                    Akku
                </span>

                <span id="batteryValue">
                    —
                </span>

            </div>

            <div class="battery-track">
                <div id="batteryBar"></div>
            </div>
            <div id="batteryWarning"
                 class="battery-warning">
            </div>

        </div>


        <button
                id="installButton"
                class="secondary">

            Als App installieren

        </button>

    </section>


    <!-- Kompakte Nutzeranzeige -->

    <section
            id="ownerCompactPanel"
            class="panel">

        <div class="owner-compact">

            <div class="owner-info">

                <div class="owner-label">
                    Haupt-Nutzer
                </div>

                <div id="ownerCompactName">
                    —
                </div>

            </div>

            <button
                    id="changeOwnerButton"
                    class="secondary small-button">

                Ändern

            </button>

        </div>

    </section>


    <!-- Nutzereinrichtung -->

    <section
            id="ownerSetupPanel"
            class="panel">

        <label for="ownerSelect">

            Hauptnutzer (wird als erstes angezeigt) ist normalerweise:

        </label>

        <select id="ownerSelect">

            <option value="">
                Bitte auswählen …
            </option>

        </select>


        <div class="owner-setup-buttons">

            <button
                    id="ownerDoneButton"
                    class="primary">

                Übernehmen

            </button>

            <button
                    id="ownerCancelButton"
                    class="secondary">

                Abbrechen

            </button>

        </div>

    </section>


    <!-- Personen -->

    <section id="personsPanel">

        <div id="persons"></div>

    </section>

    <footer class="project-branding">
        <h2>O³ OutOfOffice</h2>
        <p>User Interface for BLE E-Paper Room Signs</p>
        <div class="maker-banner-wrap">
            <img
                    src="./assets/images/kaulketh-maker-projects.png"
                    alt="Kaulketh Maker Projects"
                    class="maker-banner"
            >
        </div>


    </footer>

</main>


<script src="./assets/js/app.js"></script>

</body>
</html>
