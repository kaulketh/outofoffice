<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#174a7e">
    <link rel="manifest" href="./manifest.json">
    <link rel="icon" href="./assets/icon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="./css/base.css">
    <link rel="stylesheet" href="./css/components.css">
    <link rel="stylesheet" href="./css/themes.css">
    <title>O³ – OutOfOffice</title>
</head>
<body>
<main>
    <header>
        <h1 id="title">O³ – OutOfOffice</h1>
        <div class="header-info">
            <div id="organizationTop">Auswahl Raum-Schild</div>
            <div id="departmentTop"></div>
        </div>
    </header>
    <!-- connection and battery -->
    <section class="panel">
        <div class="connection-row">
            <div id="connectionDot" class="dot"></div>
            <button id="connectButton" class="primary"> Verbinden</button>
        </div>
        <div id="message">Bereit zum Verbinden.</div>
        <div id="lastConnected"
             class="last-connected">
        </div>
        <div id="batteryPanel">
            <div class="battery-row">
                <span class="battery-label">Akku</span>
                <span id="batteryValue">—</span>
            </div>
            <div class="battery-track">
                <div id="batteryBar"></div>
            </div>
            <div id="batteryWarning"
                 class="battery-warning">
            </div>
        </div>
        <button id="installButton" class="secondary"> Als App installieren
        </button>
    </section>
    <!-- user interface -->
    <section
            id="ownerCompactPanel"
            class="panel">
        <div class="owner-compact">
            <div class="owner-info">
                <div class="owner-label"> App-Nutzer</div>
                <div id="ownerCompactName">—</div>
            </div>
            <button id="changeOwnerButton" class="secondary small-button">
                Ändern
            </button>
        </div>
    </section>
    <!-- user setup -->
    <section
            id="ownerSetupPanel"
            class="panel">
        <label for="ownerSelect"> App-Nutzer wird zuoberst angezeigt:
        </label>
        <select id="ownerSelect">
            <option value=""> Bitte auswählen …</option>
        </select>
        <div class="owner-setup-buttons">
            <button id="ownerDoneButton" class="primary">Übernehmen</button>
            <button id="ownerCancelButton" class="secondary">Abbrechen</button>
        </div>
    </section>
    <!-- persons -->
    <section id="personsPanel">
        <div id="persons"></div>
    </section>
    <footer class="project-branding">
        <h2>O³ - OutOfOffice</h2>
        <p>User Interface for BLE E-Paper Room Signs</p>
        <div class="maker-banner-wrap">
            <a href="https://github.com/kaulketh" target="_blank" rel="noopener noreferrer">
                <img src="./assets/kaulketh-maker-projects.png" alt="Kaulketh Maker Projects" class="maker-banner">
            </a>
        </div>
    </footer>
</main>
<script type="module" src="./js/main.js"></script>
</body>
</html>
