<!DOCTYPE html>
<html lang="de">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>DWD Raumschild</title>

    <style>

        :root {
            --blue: #174a7e;
            --green: #287a3e;
            --yellow: #b47b00;
            --red: #b3261e;
            --gray: #666;
            --light-gray: #e5e5e5;
            --background: #f4f5f6;
        }


        * {
            box-sizing: border-box;
        }


        body {
            margin: 0;
            padding: 20px;

            font-family:
                system-ui,
                -apple-system,
                sans-serif;

            background: var(--background);
            color: #222;
        }


        main {
            max-width: 600px;
            margin: 0 auto;
        }


        header {
            margin-bottom: 20px;
        }


        h1 {
            margin: 0;

            color: var(--blue);
            font-size: 1.8rem;
        }


        .header-info {
            margin-top: 6px;

            color: var(--gray);
            line-height: 1.4;

            overflow-wrap: anywhere;
        }


        #organizationTop {
            font-weight: 600;
        }


        #departmentTop {
            font-size: 0.9rem;
        }


        .panel {
            background: white;

            border-radius: 12px;

            padding: 18px;

            margin-bottom: 16px;

            box-shadow:
                0 2px 8px
                rgba(0, 0, 0, 0.08);
        }


        .connection-row {
            display: flex;
            align-items: center;
            gap: 10px;
        }


        .connection-row button {
            flex: 1;
        }


        .dot {
            width: 12px;
            height: 12px;

            flex: 0 0 12px;

            border-radius: 50%;

            background: #999;
        }


        .dot.connected {
            background: var(--green);
        }


        button {
            border: 0;

            border-radius: 8px;

            padding: 12px 16px;

            font-size: 1rem;
            font-weight: 600;

            cursor: pointer;
        }


        .primary {
            background: var(--blue);
            color: white;
        }


        button:disabled {
            opacity: 0.45;
            cursor: default;
        }


        /* ====================================================
           Akku
           ==================================================== */

        #batteryPanel {
            display: none;

            margin-top: 16px;
            padding-top: 14px;

            border-top: 1px solid #ddd;
        }


        .battery-row {
            display: flex;

            justify-content: space-between;
            align-items: center;

            margin-bottom: 7px;

            font-size: 0.9rem;
        }


        .battery-label {
            font-weight: 600;
        }


        #batteryValue {
            color: var(--gray);
        }


        .battery-track {
            width: 100%;
            height: 9px;

            border-radius: 10px;

            background: var(--light-gray);

            overflow: hidden;
        }


        #batteryBar {
            height: 100%;
            width: 0%;

            border-radius: 10px;

            background: var(--green);

            transition:
                width 0.3s ease;
        }


        #batteryBar.warning {
            background: var(--yellow);
        }


        #batteryBar.low {
            background: var(--red);
        }


        label {
            display: block;

            font-size: 0.85rem;
            font-weight: 600;

            margin: 12px 0 5px;

            color: #444;
        }


        input,
        select,
        textarea {

            width: 100%;

            border: 1px solid #bbb;
            border-radius: 7px;

            padding: 10px;

            font: inherit;

            background: white;
        }


        textarea {
            min-height: 70px;
            resize: vertical;
        }


        details.person {

            background: white;

            border-radius: 12px;

            margin-bottom: 14px;

            box-shadow:
                0 2px 8px
                rgba(0, 0, 0, 0.08);

            overflow: hidden;
        }


        details.person[open] {
            border:
                1px solid
                var(--blue);
        }


        summary {
            padding:
                16px 18px;

            cursor: pointer;

            font-size: 1.15rem;
            font-weight: 700;

            color: var(--blue);
        }


        .person-body {
            padding:
                0 18px 18px;
        }


        .person-status {
            font-size: 0.9rem;

            color: var(--gray);

            margin-top: -5px;
            margin-bottom: 8px;

            overflow-wrap: anywhere;
        }


        .update-button {
            width: 100%;

            margin-top: 16px;

            background: var(--blue);

            color: white;
        }


        #message {
            min-height: 1.5em;

            margin-top: 12px;

            font-size: 0.9rem;

            overflow-wrap: anywhere;
        }


        .ok {
            color: var(--green);
        }


        .error {
            color: var(--red);
        }


        .info {
            color: var(--blue);
        }


        #ownerPanel,
        #personsPanel {
            display: none;
        }


        .organization {

            margin-top: 20px;
            padding: 12px;

            font-size: 0.78rem;

            text-align: center;

            color: var(--gray);

            line-height: 1.5;

            overflow-wrap: anywhere;
        }


        #organization {
            font-weight: 600;
        }


        #department {
            margin-top: 3px;
        }

    </style>

</head>


<body>


<main>


    <header>

        <h1 id="title">
            DWD Raumschild
        </h1>


        <div class="header-info">

            <div id="organizationTop">
                Bluetooth-Verbindung herstellen
            </div>

            <div id="departmentTop"></div>

        </div>

    </header>


    <section class="panel">


        <div class="connection-row">

            <div
                id="connectionDot"
                class="dot">
            </div>


            <button
                id="connectButton"
                class="primary">

                Raumschild verbinden

            </button>

        </div>


        <div id="message"></div>


        <!-- Akkuanzeige -->

        <div id="batteryPanel">

            <div class="battery-row">

                <span class="battery-label">
                    Akku
                </span>

                <span id="batteryValue">
                    —
                </span>

            </div>


            <div class="battery-track">

                <div id="batteryBar"></div>

            </div>

        </div>


    </section>


    <section
        id="ownerPanel"
        class="panel">


        <label for="ownerSelect">

            Dieses Smartphone wird normalerweise verwendet von:

        </label>


        <select id="ownerSelect">

            <option value="">
                Bitte auswählen …
            </option>

        </select>


    </section>


    <section id="personsPanel">


        <div id="persons"></div>


        <div class="organization">

            <div id="organization"></div>

            <div id="department"></div>

        </div>


    </section>


</main>


<datalist id="statusSuggestions">

    <option value="Anwesend">
    <option value="Unterwegs">
    <option value="Messfeld">
    <option value="Besprechung">
    <option value="Homeoffice">
    <option value="Urlaub">
    <option value="Dienstreise">
    <option value="Abwesend">

</datalist>


<script>

"use strict";


// ============================================================
// Nordic UART Service
// ============================================================

const NUS_SERVICE =
    "6e400001-b5a3-f393-e0a9-e50e24dcca9e";

const NUS_RX =
    "6e400002-b5a3-f393-e0a9-e50e24dcca9e";

const NUS_TX =
    "6e400003-b5a3-f393-e0a9-e50e24dcca9e";


// ============================================================
// BLE
// ============================================================

let device = null;
let server = null;

let rxCharacteristic = null;
let txCharacteristic = null;


// ============================================================
// Raumschild-Daten
// ============================================================

let roomNumber = "";

let organization = "";
let department = "";

let batteryVoltage = null;
let batteryPercent = null;

const people = new Map();


let notificationBuffer = "";

let refreshAfterUpdate = false;


const decoder =
    new TextDecoder();

const encoder =
    new TextEncoder();


// ============================================================
// DOM
// ============================================================

const connectButton =
    document.getElementById(
        "connectButton"
    );


const connectionDot =
    document.getElementById(
        "connectionDot"
    );


const message =
    document.getElementById(
        "message"
    );


const ownerPanel =
    document.getElementById(
        "ownerPanel"
    );


const ownerSelect =
    document.getElementById(
        "ownerSelect"
    );


const personsPanel =
    document.getElementById(
        "personsPanel"
    );


const personsContainer =
    document.getElementById(
        "persons"
    );


const batteryPanel =
    document.getElementById(
        "batteryPanel"
    );


const batteryValue =
    document.getElementById(
        "batteryValue"
    );


const batteryBar =
    document.getElementById(
        "batteryBar"
    );


// ============================================================
// Meldung
// ============================================================

function setMessage(
    text,
    type = "info")
{
    message.textContent =
        text;

    message.className =
        type;
}


// ============================================================
// Akku anzeigen
// ============================================================

function renderBattery()
{
    if (
        batteryVoltage === null ||
        batteryPercent === null
    ) {

        batteryPanel.style.display =
            "none";

        return;
    }


    batteryPanel.style.display =
        "block";


    batteryValue.textContent =
        batteryVoltage.toFixed(2) +
        " V · ca. " +
        batteryPercent +
        " %";


    const percent =
        Math.max(
            0,
            Math.min(
                100,
                batteryPercent
            )
        );


    batteryBar.style.width =
        percent + "%";


    batteryBar.classList.remove(
        "warning",
        "low"
    );


    /*
     * Bewertung bewusst anhand der Spannung,
     * nicht nur anhand des groben Prozentwertes.
     */

    if (batteryVoltage < 3.60) {

        batteryBar.classList.add(
            "low"
        );

    } else if (batteryVoltage < 3.80) {

        batteryBar.classList.add(
            "warning"
        );
    }
}


// ============================================================
// Verbindung
// ============================================================

async function connect()
{
    if (!navigator.bluetooth) {

        setMessage(
            "Web Bluetooth wird von diesem Browser nicht unterstützt.",
            "error"
        );

        return;
    }


    try {

        setMessage(
            "Raumschild auswählen …"
        );


        device =
            await navigator.bluetooth.requestDevice({

                filters: [
                    {
                        namePrefix:
                            "RAUMSCHILD-"
                    }
                ],

                optionalServices: [
                    NUS_SERVICE
                ]
            });


        device.addEventListener(
            "gattserverdisconnected",
            handleDisconnected
        );


        setMessage(
            "Verbinde …"
        );


        server =
            await device.gatt.connect();


        const service =
            await server.getPrimaryService(
                NUS_SERVICE
            );


        rxCharacteristic =
            await service.getCharacteristic(
                NUS_RX
            );


        txCharacteristic =
            await service.getCharacteristic(
                NUS_TX
            );


        await txCharacteristic
            .startNotifications();


        txCharacteristic.addEventListener(
            "characteristicvaluechanged",
            handleNotification
        );


        connectionDot.classList.add(
            "connected"
        );


        connectButton.textContent =
            "Verbunden";


        connectButton.disabled =
            true;


        people.clear();

        roomNumber = "";
        organization = "";
        department = "";

        batteryVoltage = null;
        batteryPercent = null;

        notificationBuffer = "";


        batteryPanel.style.display =
            "none";

        ownerPanel.style.display =
            "none";

        personsPanel.style.display =
            "none";


        setMessage(
            "Verbunden – lese Konfiguration …",
            "info"
        );


        await sendCommand(
            "INFO"
        );

    }
    catch (error) {

        console.error(error);


        setMessage(
            "Verbindung fehlgeschlagen: " +
            error.message,
            "error"
        );
    }
}


// ============================================================
// Disconnect
// ============================================================

function handleDisconnected()
{
    connectionDot.classList.remove(
        "connected"
    );


    connectButton.textContent =
        "Raumschild verbinden";


    connectButton.disabled =
        false;


    setMessage(
        "Bluetooth-Verbindung getrennt.",
        "error"
    );


    rxCharacteristic = null;
    txCharacteristic = null;
    server = null;
}


// ============================================================
// BLE senden
// ============================================================

async function sendCommand(command)
{
    if (!rxCharacteristic) {

        throw new Error(
            "Keine Bluetooth-Verbindung"
        );
    }


    const data =
        encoder.encode(command);


    const CHUNK_SIZE = 18;


    for (
        let offset = 0;
        offset < data.length;
        offset += CHUNK_SIZE
    ) {

        const chunk =
            data.slice(
                offset,
                offset + CHUNK_SIZE
            );


        if (
            rxCharacteristic
                .properties
                .writeWithoutResponse
        ) {

            await rxCharacteristic
                .writeValueWithoutResponse(
                    chunk
                );

        } else {

            await rxCharacteristic
                .writeValueWithResponse(
                    chunk
                );
        }


        await delay(12);
    }
}


// ============================================================
// BLE Notifications
// ============================================================

function handleNotification(event)
{
    const value =
        event.target.value;


    const bytes =
        new Uint8Array(
            value.buffer,
            value.byteOffset,
            value.byteLength
        );


    notificationBuffer +=
        decoder.decode(
            bytes,
            {
                stream: true
            }
        );


    while (
        notificationBuffer.includes("\n")
    ) {

        const position =
            notificationBuffer.indexOf(
                "\n"
            );


        let line =
            notificationBuffer.slice(
                0,
                position
            );


        notificationBuffer =
            notificationBuffer.slice(
                position + 1
            );


        line =
            line.replace(
                /\r$/,
                ""
            );


        line =
            line.trim();


        if (line.length > 0) {

            processLine(
                line
            );
        }
    }
}


// ============================================================
// Protokoll auswerten
// ============================================================

function processLine(line)
{
    console.log(
        "Raumschild:",
        line
    );


    if (line === "INFO_BEGIN") {

        setMessage(
            "Lese Raumschild-Konfiguration …",
            "info"
        );

        return;
    }


    if (line === "INFO_END") {

        setMessage(
            "Konfiguration gelesen – lese Status …",
            "info"
        );


        sendCommand(
            "GET"
        ).catch(
            handleCommandError
        );


        return;
    }


    if (line === "STATE_BEGIN") {
        return;
    }


    if (line === "STATE_END") {

        rebuildOwnerSelect();

        renderPeople();


        ownerPanel.style.display =
            "block";


        personsPanel.style.display =
            "block";


        if (refreshAfterUpdate) {

            setMessage(
                "Raumschild wurde aktualisiert.",
                "ok"
            );

            refreshAfterUpdate =
                false;

        } else {

            setMessage(
                "Raumschild vollständig geladen.",
                "ok"
            );
        }


        return;
    }


    const fields =
        line.split("|");


    switch (fields[0]) {


        case "ROOM":

            roomNumber =
                fields
                    .slice(1)
                    .join("|");


            document.getElementById(
                "title"
            ).textContent =
                "Raum " +
                roomNumber;


            loadOwnerPreference();

            break;


        case "ORG":

            organization =
                fields
                    .slice(1)
                    .join("|");


            document.getElementById(
                "organization"
            ).textContent =
                organization;


            document.getElementById(
                "organizationTop"
            ).textContent =
                organization;

            break;


        case "DEPT":

            department =
                fields
                    .slice(1)
                    .join("|");


            document.getElementById(
                "department"
            ).textContent =
                department;


            document.getElementById(
                "departmentTop"
            ).textContent =
                department;

            break;


        case "PERSON":

            ensurePerson(
                fields[1],
                fields
                    .slice(2)
                    .join("|")
            );

            break;


        case "BAT":

            processBattery(
                fields
            );

            break;


        case "STATE":

            processState(
                fields
            );

            break;


        case "OK":

            setMessage(
                "Änderung übernommen.",
                "ok"
            );

            break;


        case "REFRESHING":

            setMessage(
                "E-Paper wird aktualisiert …",
                "info"
            );


            setUpdateButtons(
                false
            );

            break;


        case "READY":

            refreshAfterUpdate =
                true;


            sendCommand(
                "GET"
            ).catch(
                handleCommandError
            );

            break;


        case "ERR":

            setMessage(
                "Raumschild meldet Fehler: " +
                fields
                    .slice(1)
                    .join(" "),
                "error"
            );


            setUpdateButtons(
                true
            );

            break;
    }
}


// ============================================================
// Akku-Protokoll
//
// BAT|3.88|55
// ============================================================

function processBattery(fields)
{
    if (
        fields.length < 2 ||
        fields[1] === "NA"
    ) {

        batteryVoltage =
            null;

        batteryPercent =
            null;


        batteryPanel.style.display =
            "none";

        return;
    }


    const voltage =
        Number(
            fields[1]
        );


    const percent =
        Number(
            fields[2]
        );


    if (
        !Number.isFinite(voltage) ||
        !Number.isFinite(percent)
    ) {

        return;
    }


    batteryVoltage =
        voltage;


    batteryPercent =
        percent;


    renderBattery();
}


// ============================================================
// BLE Fehler
// ============================================================

function handleCommandError(error)
{
    console.error(
        error
    );


    setMessage(
        "Bluetooth-Fehler: " +
        error.message,
        "error"
    );


    setUpdateButtons(
        true
    );
}


// ============================================================
// Person erzeugen
// ============================================================

function ensurePerson(
    id,
    name)
{
    if (!people.has(id)) {

        people.set(
            id,
            {
                id: id,
                name: name,
                status: "",
                text: ""
            }
        );

    } else if (name) {

        people.get(id).name =
            name;
    }
}


// ============================================================
// STATE auswerten
// ============================================================

function processState(fields)
{
    const id =
        fields[1];


    const name =
        fields[2] ?? "";


    const status =
        fields[3] ?? "";


    const text =
        fields
            .slice(4)
            .join("|");


    ensurePerson(
        id,
        name
    );


    const person =
        people.get(id);


    person.status =
        status;


    person.text =
        text;
}


// ============================================================
// Owner
// ============================================================

function ownerStorageKey()
{
    return (
        "raumschild-owner-" +
        (
            roomNumber ||
            "default"
        )
    );
}


function getPreferredPerson()
{
    return (
        localStorage.getItem(
            ownerStorageKey()
        ) || ""
    );
}


function loadOwnerPreference()
{
    const saved =
        getPreferredPerson();


    if (saved) {

        ownerSelect.value =
            saved;
    }
}


ownerSelect.addEventListener(
    "change",
    () => {

        if (ownerSelect.value) {

            localStorage.setItem(
                ownerStorageKey(),
                ownerSelect.value
            );

        } else {

            localStorage.removeItem(
                ownerStorageKey()
            );
        }


        renderPeople();
    }
);


// ============================================================
// Owner-Auswahl
// ============================================================

function rebuildOwnerSelect()
{
    const selected =
        getPreferredPerson();


    ownerSelect.innerHTML =
        '<option value="">Bitte auswählen …</option>';


    for (
        const person
        of people.values()
    ) {

        const option =
            document.createElement(
                "option"
            );


        option.value =
            person.id;


        option.textContent =
            person.name;


        ownerSelect.appendChild(
            option
        );
    }


    if (
        selected &&
        people.has(selected)
    ) {

        ownerSelect.value =
            selected;
    }
}


// ============================================================
// Personen anzeigen
// ============================================================

function renderPeople()
{
    personsContainer.innerHTML =
        "";


    const preferred =
        getPreferredPerson();


    let list =
        Array.from(
            people.values()
        );


    if (preferred) {

        list.sort(
            (a, b) => {

                if (
                    a.id === preferred
                ) {
                    return -1;
                }


                if (
                    b.id === preferred
                ) {
                    return 1;
                }


                return 0;
            }
        );
    }


    for (
        const person
        of list
    ) {

        const details =
            document.createElement(
                "details"
            );


        details.className =
            "person";


        if (
            !preferred ||
            person.id === preferred
        ) {

            details.open =
                true;
        }


        const summary =
            document.createElement(
                "summary"
            );


        summary.textContent =
            person.name;


        const body =
            document.createElement(
                "div"
            );


        body.className =
            "person-body";


        const current =
            document.createElement(
                "div"
            );


        current.className =
            "person-status";


        current.textContent =
            currentStatusText(
                person
            );


        body.innerHTML = `

            <label>
                Status
            </label>

            <input
                id="status-${person.id}"
                list="statusSuggestions"
                maxlength="24"
                autocomplete="off"
            >


            <label>
                Zusatztext
            </label>

            <textarea
                id="text-${person.id}"
                maxlength="80"
                placeholder="z. B. Westschenkel oder bis 18.11."
            ></textarea>


            <button
                class="update-button"
                data-person="${person.id}"
            >
                ${person.name} aktualisieren
            </button>
        `;


        body.prepend(
            current
        );


        details.appendChild(
            summary
        );


        details.appendChild(
            body
        );


        personsContainer.appendChild(
            details
        );


        document.getElementById(
            "status-" +
            person.id
        ).value =
            person.status;


        document.getElementById(
            "text-" +
            person.id
        ).value =
            person.text;
    }


    document
        .querySelectorAll(
            ".update-button"
        )
        .forEach(
            button => {

                button.addEventListener(
                    "click",
                    () =>
                        updatePerson(
                            button
                                .dataset
                                .person
                        )
                );
            }
        );
}


// ============================================================
// Statusanzeige
// ============================================================

function currentStatusText(person)
{
    let result =
        "Aktuell: " +
        (
            person.status ||
            "–"
        );


    if (person.text) {

        result +=
            " – " +
            person.text;
    }


    return result;
}


// ============================================================
// Person aktualisieren
// ============================================================

async function updatePerson(id)
{
    const person =
        people.get(id);


    if (!person) {
        return;
    }


    let status =
        document
            .getElementById(
                "status-" + id
            )
            .value
            .trim();


    let text =
        document
            .getElementById(
                "text-" + id
            )
            .value
            .trim();


    if (
        status.includes("|") ||
        text.includes("|")
    ) {

        setMessage(
            'Das Zeichen "|" kann nicht verwendet werden.',
            "error"
        );

        return;
    }


    status =
        status.replace(
            /[\r\n]+/g,
            " "
        );


    text =
        text.replace(
            /[\r\n]+/g,
            " "
        );


    status =
        normalizeGerman(
            status
        );


    text =
        normalizeGerman(
            text
        );


    const command =
        `SET|${id}|${status}|${text}`;


    try {

        setUpdateButtons(
            false
        );


        setMessage(
            "Sende Änderung …",
            "info"
        );


        await sendCommand(
            command
        );

    }
    catch (error) {

        handleCommandError(
            error
        );
    }
}


// ============================================================
// Sonderzeichen
// ============================================================

function normalizeGerman(text)
{
    return text

        .replaceAll("ä", "ae")
        .replaceAll("ö", "oe")
        .replaceAll("ü", "ue")
        .replaceAll("Ä", "Ae")
        .replaceAll("Ö", "Oe")
        .replaceAll("Ü", "Ue")
        .replaceAll("ß", "ss");
}


// ============================================================
// Buttons
// ============================================================

function setUpdateButtons(enabled)
{
    document
        .querySelectorAll(
            ".update-button"
        )
        .forEach(
            button => {

                button.disabled =
                    !enabled;
            }
        );
}


// ============================================================
// Pause
// ============================================================

function delay(ms)
{
    return new Promise(
        resolve =>
            setTimeout(
                resolve,
                ms
            )
    );
}


// ============================================================
// Connect
// ============================================================

connectButton.addEventListener(
    "click",
    connect
);

</script>


</body>

</html>
