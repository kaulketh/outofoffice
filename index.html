<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <meta name="theme-color" content="#174a7e">

    <link rel="manifest" href="./manifest.json">
    <link rel="icon" href="./icon.svg" type="image/svg+xml">

    <title>DWD Raumschild</title>

    <style>
        :root {
            --blue: #174a7e;
            --green: #287a3e;
            --yellow: #b47b00;
            --red: #b3261e;
            --gray: #666;
            --light-gray: #e5e5e5;
            --background: #f4f5f6;
            --panel: #ffffff;
            --text: #222;
            --border: #ccc;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 20px;

            font-family: system-ui,
            -apple-system,
            sans-serif;

            background: var(--background);
            color: var(--text);
        }

        main {
            max-width: 600px;
            margin: 0 auto;
        }

        header {
            margin-bottom: 20px;
        }

        h1 {
            margin: 0;
            color: var(--blue);
            font-size: 1.8rem;
        }

        .header-info {
            margin-top: 6px;
            color: var(--gray);
            line-height: 1.4;
            overflow-wrap: anywhere;
        }

        #organizationTop {
            font-weight: 600;
        }

        #departmentTop {
            font-size: 0.9rem;
        }

        .panel {
            background: var(--panel);
            border-radius: 12px;
            padding: 18px;
            margin-bottom: 16px;

            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
        }

        .connection-row {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .connection-row button {
            flex: 1;
        }

        .dot {
            width: 12px;
            height: 12px;
            flex: 0 0 12px;
            border-radius: 50%;
            background: #999;
        }

        .dot.connected {
            background: var(--green);
        }

        button {
            border: 0;
            border-radius: 8px;
            padding: 12px 16px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
        }

        button:disabled {
            opacity: 0.45;
            cursor: default;
        }

        .primary {
            background: var(--blue);
            color: white;
        }

        .secondary {
            background: transparent;
            color: var(--blue);
            border: 1px solid var(--blue);
        }

        .small-button {
            padding: 7px 11px;
            font-size: 0.85rem;
        }

        #message {
            min-height: 1.5em;
            margin-top: 12px;
            font-size: 0.9rem;
            overflow-wrap: anywhere;
        }

        .ok {
            color: var(--green);
        }

        .error {
            color: var(--red);
        }

        .info {
            color: var(--blue);
        }


        /* Akku */

        #batteryPanel {
            display: none;
            margin-top: 16px;
            padding-top: 14px;
            border-top: 1px solid var(--border);
        }

        .battery-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 7px;
            font-size: 0.9rem;
        }

        .battery-label {
            font-weight: 600;
        }

        #batteryValue {
            color: var(--gray);
        }

        .battery-track {
            width: 100%;
            height: 9px;
            border-radius: 10px;
            background: var(--light-gray);
            overflow: hidden;
        }

        #batteryBar {
            height: 100%;
            width: 0%;
            border-radius: 10px;
            background: var(--green);
            transition: width 0.3s ease;
        }

        #batteryBar.warning {
            background: var(--yellow);
        }

        #batteryBar.low {
            background: var(--red);
        }


        /* Nutzer */

        #ownerSetupPanel,
        #ownerCompactPanel,
        #personsPanel {
            display: none;
        }

        .owner-compact {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 15px;
        }

        .owner-info {
            min-width: 0;
        }

        .owner-label {
            font-size: 0.75rem;
            color: var(--gray);
            margin-bottom: 2px;
        }

        #ownerCompactName {
            font-size: 1.05rem;
            font-weight: 700;
            overflow-wrap: anywhere;
        }

        label {
            display: block;
            font-size: 0.85rem;
            font-weight: 600;
            margin: 12px 0 5px;
            color: var(--text);
        }

        select,
        input,
        textarea {
            width: 100%;
            border: 1px solid var(--border);
            border-radius: 7px;
            padding: 10px;
            font: inherit;
            color: var(--text);
            background: var(--panel);
        }

        textarea {
            min-height: 70px;
            resize: vertical;
        }

        .owner-setup-buttons {
            display: flex;
            gap: 8px;
            margin-top: 12px;
        }


        /* Personen */

        details.person {
            background: var(--panel);
            border-radius: 12px;
            margin-bottom: 14px;

            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);

            overflow: hidden;
        }

        details.person[open] {
            border: 1px solid var(--blue);
        }

        summary {
            padding: 16px 18px;
            cursor: pointer;
            font-size: 1.15rem;
            font-weight: 700;
            color: var(--blue);
        }

        .person-body {
            padding: 0 18px 18px;
        }

        .person-status {
            font-size: 0.9rem;
            color: var(--gray);
            margin-top: -5px;
            margin-bottom: 8px;
            overflow-wrap: anywhere;
        }

        .update-button {
            width: 100%;
            margin-top: 16px;
            background: var(--blue);
            color: white;
        }

        .organization {
            margin-top: 20px;
            padding: 12px;
            font-size: 0.78rem;
            text-align: center;
            color: var(--gray);
            line-height: 1.5;
            overflow-wrap: anywhere;
        }

        #organization {
            font-weight: 600;
        }

        #department {
            margin-top: 3px;
        }


        /* PWA */

        #installButton {
            display: none;
            width: 100%;
            margin-top: 10px;
        }


        /* Dark Mode */

        @media (prefers-color-scheme: dark) {
            :root {
                --background: #111315;
                --panel: #1e1e1e;
                --text: #f0f0f0;
                --gray: #b5b5b5;
                --border: #555;
                --light-gray: #292929;
                --blue: #8ec5ff;
            }

            .primary,
            .update-button {
                background: #1c4b82;
                color: white;
            }

            .secondary {
                color: #8ec5ff;
                border-color: #4778aa;
            }
        }

        .maker-footer {
            margin-top: 22px;
            padding-top: 16px;

            border-top: 1px solid var(--border);

            display: flex;
            justify-content: center;
            align-items: center;

            gap: 10px;

            opacity: 0.7;
        }


        .maker-logo {
            width: 36px;
            height: 36px;

            object-fit: contain;
        }


        .maker-text {
            text-align: left;
            line-height: 1.2;
        }


        .maker-name {
            font-weight: 700;
            font-size: 0.85rem;

            color: var(--blue);
        }


        .maker-tagline {
            margin-top: 2px;

            font-size: 0.68rem;

            color: var(--gray);
        }

        .maker-banner-wrap {
            margin-top: 24px;
            padding-top: 16px;

            border-top: 1px solid var(--border);

            display: flex;
            justify-content: center;
        }


        .maker-banner {
            display: block;

            width: min(100%, 520px);
            height: auto;

            opacity: 0.78;

            border-radius: 8px;
        }

        .battery-warning {
            display: none;
            margin-top: 10px;
            padding: 9px 11px;

            border-radius: 7px;

            font-size: 0.82rem;
            font-weight: 600;
        }

        .battery-warning.warning {
            display: block;

            color: var(--yellow);

            border: 1px solid var(--yellow);
        }

        .battery-warning.critical {
            display: block;

            color: var(--red);

            border: 1px solid var(--red);
        }

        .last-connected {
            margin-top: 5px;

            font-size: 0.75rem;

            color: var(--gray);
        }

    </style>
</head>


<body>

<main>

    <header>

        <h1 id="title">
            DWD Raumschild
        </h1>

        <div class="header-info">

            <div id="organizationTop">
                Bluetooth-Verbindung zum Raumschild
            </div>

            <div id="departmentTop"></div>

        </div>

    </header>


    <!-- Verbindung + Akku -->

    <section class="panel">

        <div class="connection-row">

            <div
                    id="connectionDot"
                    class="dot">
            </div>

            <button
                    id="connectButton"
                    class="primary">

                Raumschild verbinden

            </button>

        </div>


        <div id="message">
            Bereit zum Verbinden.
        </div>
        <div id="lastConnected"
             class="last-connected">
        </div>


        <div id="batteryPanel">

            <div class="battery-row">

                <span class="battery-label">
                    Akku
                </span>

                <span id="batteryValue">
                    —
                </span>

            </div>

            <div class="battery-track">
                <div id="batteryBar"></div>
            </div>
            <div id="batteryWarning"
                 class="battery-warning">
            </div>

        </div>


        <button
                id="installButton"
                class="secondary">

            Als App installieren

        </button>

    </section>


    <!-- Kompakte Nutzeranzeige -->

    <section
            id="ownerCompactPanel"
            class="panel">

        <div class="owner-compact">

            <div class="owner-info">

                <div class="owner-label">
                    Haupt-Nutzer
                </div>

                <div id="ownerCompactName">
                    —
                </div>

            </div>

            <button
                    id="changeOwnerButton"
                    class="secondary small-button">

                Ändern

            </button>

        </div>

    </section>


    <!-- Nutzereinrichtung -->

    <section
            id="ownerSetupPanel"
            class="panel">

        <label for="ownerSelect">

            Hauptnutzer (wird als erstes angezeigt) ist normalerweise:

        </label>

        <select id="ownerSelect">

            <option value="">
                Bitte auswählen …
            </option>

        </select>


        <div class="owner-setup-buttons">

            <button
                    id="ownerDoneButton"
                    class="primary">

                Übernehmen

            </button>

            <button
                    id="ownerCancelButton"
                    class="secondary">

                Abbrechen

            </button>

        </div>

    </section>


    <!-- Personen -->

    <section id="personsPanel">

        <div id="persons"></div>


        <div class="maker-banner-wrap">
            <img
                    src="https://raw.githubusercontent.com/kaulketh/kaulketh/master/assets/Kaulketh%20Maker%20Projects%20Branding%20banner.png"
                    alt="Kaulketh Maker Projects"
                    class="maker-banner"
            >
        </div>


    </section>

</main>


<script>

    "use strict";


    // ============================================================
    // Nordic UART Service
    // ============================================================

    const NUS_SERVICE =
        "6e400001-b5a3-f393-e0a9-e50e24dcca9e";

    const NUS_RX =
        "6e400002-b5a3-f393-e0a9-e50e24dcca9e";

    const NUS_TX =
        "6e400003-b5a3-f393-e0a9-e50e24dcca9e";


    // ============================================================
    // BLE
    // ============================================================

    let device = null;
    let server = null;

    let rxCharacteristic = null;
    let txCharacteristic = null;


    // ============================================================
    // Daten
    // ============================================================

    let roomNumber = "";

    let organization = "";
    let department = "";

    let batteryVoltage = null;
    let batteryPercent = null;

    let notificationBuffer = "";

    let refreshAfterUpdate = false;

    const people = new Map();

    const decoder = new TextDecoder();
    const encoder = new TextEncoder();


    // ============================================================
    // DOM
    // ============================================================

    const connectButton =
        document.getElementById("connectButton");

    const connectionDot =
        document.getElementById("connectionDot");

    const message =
        document.getElementById("message");

    const batteryPanel =
        document.getElementById("batteryPanel");

    const batteryValue =
        document.getElementById("batteryValue");

    const batteryBar =
        document.getElementById("batteryBar");

    const batteryWarning =
        document.getElementById("batteryWarning");

    const lastConnected = document.getElementById("lastConnected");

    const ownerCompactPanel =
        document.getElementById("ownerCompactPanel");

    const ownerCompactName =
        document.getElementById("ownerCompactName");

    const changeOwnerButton =
        document.getElementById("changeOwnerButton");


    const ownerSetupPanel =
        document.getElementById("ownerSetupPanel");

    const ownerSelect =
        document.getElementById("ownerSelect");

    const ownerDoneButton =
        document.getElementById("ownerDoneButton");

    const ownerCancelButton =
        document.getElementById("ownerCancelButton");


    const personsPanel =
        document.getElementById("personsPanel");

    const personsContainer =
        document.getElementById("persons");


    const installButton =
        document.getElementById("installButton");


    // ============================================================
    // Meldung
    // ============================================================

    function setMessage(
        text,
        type = "info") {
        message.textContent = text;
        message.className = type;
    }


    // ============================================================
    // Akku
    // ============================================================

    function renderBattery() {
        if (
            batteryVoltage === null ||
            batteryPercent === null
        ) {
            batteryPanel.style.display =
                "none";

            return;
        }


        batteryPanel.style.display =
            "block";


        batteryValue.textContent =
            batteryVoltage.toFixed(2) +
            " V · ca. " +
            batteryPercent +
            " %";


        const percent =
            Math.max(
                0,
                Math.min(
                    100,
                    batteryPercent
                )
            );


        batteryBar.style.width =
            percent + "%";


        batteryBar.classList.remove(
            "warning",
            "low"
        );


        batteryWarning.classList.remove(
            "warning",
            "critical"
        );

        batteryWarning.style.display =
            "none";


        // --------------------------------------------------------
        // Bewertung anhand der realen Spannung
        // --------------------------------------------------------

        if (batteryVoltage < 3.60) {

            batteryBar.classList.add(
                "low"
            );


            batteryWarning.textContent =
                "Akku bald laden.";

            batteryWarning.classList.add(
                "critical"
            );

            batteryWarning.style.display =
                "block";

        } else if (batteryVoltage < 3.80) {

            batteryBar.classList.add(
                "warning"
            );


            batteryWarning.textContent =
                "Akkustand niedrig – bei Gelegenheit laden.";

            batteryWarning.classList.add(
                "warning"
            );

            batteryWarning.style.display =
                "block";
        }
    }


    function processBattery(fields) {
        if (
            fields.length < 2 ||
            fields[1] === "NA"
        ) {
            batteryVoltage = null;
            batteryPercent = null;

            batteryPanel.style.display =
                "none";

            return;
        }


        const voltage =
            Number(fields[1]);

        const percent =
            Number(fields[2]);


        if (
            !Number.isFinite(voltage) ||
            !Number.isFinite(percent)
        ) {
            return;
        }


        batteryVoltage = voltage;
        batteryPercent = percent;

        renderBattery();
    }


    // ============================================================
    // BLE verbinden
    // ============================================================

    async function connect() {
        if (!navigator.bluetooth) {

            setMessage(
                "Web Bluetooth wird von diesem Browser nicht unterstützt.",
                "error"
            );

            return;
        }


        try {

            setMessage(
                "Raumschild auswählen …",
                "info"
            );


            device =
                await navigator.bluetooth.requestDevice({

                    filters: [
                        {
                            namePrefix:
                                "RAUMSCHILD-"
                        }
                    ],

                    optionalServices: [
                        NUS_SERVICE
                    ]
                });


            device.addEventListener(
                "gattserverdisconnected",
                handleDisconnected
            );


            setMessage(
                "Verbinde …",
                "info"
            );


            server =
                await device.gatt.connect();


            const service =
                await server.getPrimaryService(
                    NUS_SERVICE
                );


            rxCharacteristic =
                await service.getCharacteristic(
                    NUS_RX
                );


            txCharacteristic =
                await service.getCharacteristic(
                    NUS_TX
                );


            await txCharacteristic
                .startNotifications();


            txCharacteristic.addEventListener(
                "characteristicvaluechanged",
                handleNotification
            );


            connectionDot.classList.add(
                "connected"
            );


            connectButton.textContent =
                "Verbunden";


            connectButton.disabled =
                true;


            resetRemoteData();


            setMessage(
                "Verbunden – lese Konfiguration …",
                "info"
            );


            await sendCommand(
                "INFO"
            );

        } catch (error) {

            if (error.name === "NotFoundError") {

                setMessage(
                    "Keine Verbindung hergestellt.",
                    "info"
                );

                return;
            }


            console.error(error);


            setMessage(
                "Verbindung fehlgeschlagen: " +
                error.message,
                "error"
            );
        }
    }


    // ============================================================
    // Daten zurücksetzen
    // ============================================================

    function resetRemoteData() {
        people.clear();

        roomNumber = "";
        organization = "";
        department = "";

        batteryVoltage = null;
        batteryPercent = null;

        notificationBuffer = "";


        batteryPanel.style.display =
            "none";


        ownerCompactPanel.style.display =
            "none";


        ownerSetupPanel.style.display =
            "none";


        personsPanel.style.display =
            "none";
    }


    // ============================================================
    // Disconnect
    // ============================================================

    function handleDisconnected() {
        connectionDot.classList.remove(
            "connected"
        );


        connectButton.textContent =
            "Raumschild verbinden";


        connectButton.disabled =
            false;


        setMessage(
            "Bluetooth-Verbindung getrennt.",
            "error"
        );


        rxCharacteristic = null;
        txCharacteristic = null;
        server = null;
    }


    // ============================================================
    // BLE senden
    // ============================================================

    async function sendCommand(command) {
        if (!rxCharacteristic) {

            throw new Error(
                "Keine Bluetooth-Verbindung"
            );
        }


        const data =
            encoder.encode(command);


        const CHUNK_SIZE = 18;


        for (
            let offset = 0;
            offset < data.length;
            offset += CHUNK_SIZE
        ) {

            const chunk =
                data.slice(
                    offset,
                    offset + CHUNK_SIZE
                );


            if (
                rxCharacteristic
                    .properties
                    .writeWithoutResponse
            ) {

                await rxCharacteristic
                    .writeValueWithoutResponse(
                        chunk
                    );

            } else {

                await rxCharacteristic
                    .writeValueWithResponse(
                        chunk
                    );
            }


            await delay(12);
        }
    }


    // ============================================================
    // BLE Notifications
    // ============================================================

    function handleNotification(event) {
        const value =
            event.target.value;


        const bytes =
            new Uint8Array(
                value.buffer,
                value.byteOffset,
                value.byteLength
            );


        notificationBuffer +=
            decoder.decode(
                bytes,
                {
                    stream: true
                }
            );


        while (
            notificationBuffer.includes("\n")
            ) {

            const position =
                notificationBuffer.indexOf(
                    "\n"
                );


            let line =
                notificationBuffer.slice(
                    0,
                    position
                );


            notificationBuffer =
                notificationBuffer.slice(
                    position + 1
                );


            line =
                line
                    .replace(/\r$/, "")
                    .trim();


            if (line.length > 0) {
                processLine(line);
            }
        }
    }


    // ============================================================
    // Protokoll
    // ============================================================

    function processLine(line) {
        console.log(
            "Raumschild:",
            line
        );


        if (line === "INFO_BEGIN") {

            setMessage(
                "Lese Konfiguration …",
                "info"
            );

            return;
        }


        if (line === "INFO_END") {

            setMessage(
                "Konfiguration gelesen – lese Status …",
                "info"
            );


            sendCommand("GET")
                .catch(handleCommandError);

            return;
        }


        if (line === "STATE_BEGIN") {
            return;
        }


        if (line === "STATE_END") {
            const now =
                new Date();


            lastConnected.textContent =
                "Zuletzt verbunden: " +
                now.toLocaleTimeString(
                    "de-DE",
                    {
                        hour: "2-digit",
                        minute: "2-digit"
                    }
                );
            rebuildOwnerSelect();
            updateOwnerDisplay();
            renderPeople();


            personsPanel.style.display =
                "block";


            if (refreshAfterUpdate) {

                setMessage(
                    "Schild-Inhalt wurde aktualisiert.",
                    "ok"
                );

                refreshAfterUpdate =
                    false;

            } else {

                setMessage(
                    "Schild-Inhalt vollständig geladen.",
                    "ok"
                );
            }


            setUpdateButtons(true);

            return;
        }


        const fields =
            line.split("|");


        switch (fields[0]) {

            case "ROOM":

                roomNumber =
                    fields
                        .slice(1)
                        .join("|");


                document
                    .getElementById("title")
                    .textContent =
                    "BG Raum " +
                    roomNumber;

                break;


            case "ORG":

                organization =
                    fields
                        .slice(1)
                        .join("|");

                document
                    .getElementById("organizationTop")
                    .textContent =
                        organization;

                break;


            case "DEPT":

                department =
                    fields
                        .slice(1)
                        .join("|");

                document
                    .getElementById("departmentTop")
                    .textContent =
                    department;

                break;


            case "PERSON":

                ensurePerson(
                    fields[1],
                    fields
                        .slice(2)
                        .join("|")
                );

                break;


            case "BAT":

                processBattery(fields);
                break;


            case "STATE":

                processState(fields);
                break;


            case "OK":

                setMessage(
                    "Änderung übernommen.",
                    "ok"
                );

                break;


            case "REFRESHING":

                setMessage(
                    "E-Paper wird aktualisiert …",
                    "info"
                );

                setUpdateButtons(false);

                break;


            case "READY":

                refreshAfterUpdate =
                    true;


                sendCommand("GET")
                    .catch(handleCommandError);

                break;


            case "ERR":

                setMessage(
                    "Raumschild meldet Fehler: " +
                    fields
                        .slice(1)
                        .join(" "),
                    "error"
                );


                setUpdateButtons(true);

                break;
        }
    }


    // ============================================================
    // Person
    // ============================================================

    function ensurePerson(
        id,
        name) {
        if (!people.has(id)) {

            people.set(
                id,
                {
                    id: id,
                    name: name,
                    status: "",
                    text: ""
                }
            );

        } else if (name) {

            people.get(id).name =
                name;
        }
    }


    function processState(fields) {
        const id =
            fields[1];

        const name =
            fields[2] ?? "";

        const status =
            fields[3] ?? "";

        const text =
            fields
                .slice(4)
                .join("|");


        ensurePerson(
            id,
            name
        );


        const person =
            people.get(id);


        person.status =
            status;

        person.text =
            text;
    }


    // ============================================================
    // Nutzer
    // ============================================================

    function ownerStorageKey() {
        return (
            "raumschild-owner-" +
            (
                roomNumber ||
                "default"
            )
        );
    }


    function getPreferredPerson() {
        return (
            localStorage.getItem(
                ownerStorageKey()
            ) || ""
        );
    }


    function setPreferredPerson(id) {
        if (id) {

            localStorage.setItem(
                ownerStorageKey(),
                id
            );

        } else {

            localStorage.removeItem(
                ownerStorageKey()
            );
        }
    }


    function rebuildOwnerSelect() {
        const selected =
            getPreferredPerson();


        ownerSelect.innerHTML =
            '<option value="">Bitte auswählen …</option>';


        for (
            const person
            of people.values()
            ) {

            const option =
                document.createElement(
                    "option"
                );


            option.value =
                person.id;

            option.textContent =
                person.name;


            ownerSelect.appendChild(
                option
            );
        }


        if (
            selected &&
            people.has(selected)
        ) {

            ownerSelect.value =
                selected;
        }
    }


    function updateOwnerDisplay() {
        const preferred =
            getPreferredPerson();


        if (
            preferred &&
            people.has(preferred)
        ) {

            ownerCompactName.textContent =
                people.get(preferred).name;


            ownerCompactPanel.style.display =
                "block";


            ownerSetupPanel.style.display =
                "none";

        } else {

            ownerCompactPanel.style.display =
                "none";


            ownerSetupPanel.style.display =
                "block";


            ownerCancelButton.style.display =
                "none";
        }
    }


    changeOwnerButton.addEventListener(
        "click",
        () => {

            const preferred =
                getPreferredPerson();


            ownerSelect.value =
                preferred;


            ownerCompactPanel.style.display =
                "none";


            ownerSetupPanel.style.display =
                "block";


            ownerCancelButton.style.display =
                preferred
                    ? "inline-block"
                    : "none";
        }
    );


    ownerDoneButton.addEventListener(
        "click",
        () => {

            const selected =
                ownerSelect.value;


            if (!selected) {

                setMessage(
                    "Bitte zuerst einen Nutzer auswählen.",
                    "error"
                );

                return;
            }


            setPreferredPerson(
                selected
            );


            updateOwnerDisplay();
            renderPeople();
        }
    );


    ownerCancelButton.addEventListener(
        "click",
        () => {

            rebuildOwnerSelect();
            updateOwnerDisplay();
        }
    );


    // ============================================================
    // Personen darstellen
    // ============================================================

    function renderPeople() {
        personsContainer.innerHTML =
            "";


        const preferred =
            getPreferredPerson();


        let list =
            Array.from(
                people.values()
            );


        if (preferred) {

            list.sort(
                (a, b) => {

                    if (
                        a.id === preferred
                    ) {
                        return -1;
                    }


                    if (
                        b.id === preferred
                    ) {
                        return 1;
                    }


                    return 0;
                }
            );
        }


        for (
            const person
            of list
            ) {

            const details =
                document.createElement(
                    "details"
                );


            details.className =
                "person";


            if (
                !preferred ||
                person.id === preferred
            ) {

                details.open =
                    true;
            }


            const summary =
                document.createElement(
                    "summary"
                );


            summary.textContent =
                person.name;


            const body =
                document.createElement(
                    "div"
                );


            body.className =
                "person-body";


            const current =
                document.createElement(
                    "div"
                );


            current.className =
                "person-status";


            current.textContent =
                currentStatusText(
                    person
                );


            body.innerHTML = `

            <label>
                Status
            </label>

            <input
                id="status-${person.id}"
                maxlength="48"
                autocomplete="on"
            >


            <label>
                Zusatztext
            </label>

            <textarea
                id="text-${person.id}"
                maxlength="160"
                autocomplete="on"
                placeholder="Freitext"
            ></textarea>


            <button
                class="update-button"
                data-person="${person.id}"
            >
                ${person.name} aktualisieren
            </button>
        `;


            body.prepend(
                current
            );


            details.appendChild(
                summary
            );


            details.appendChild(
                body
            );


            personsContainer.appendChild(
                details
            );


            document
                .getElementById(
                    "status-" +
                    person.id
                )
                .value =
                person.status;


            document
                .getElementById(
                    "text-" +
                    person.id
                )
                .value =
                person.text;
        }


        document
            .querySelectorAll(
                ".update-button"
            )
            .forEach(
                button => {

                    button.addEventListener(
                        "click",
                        () =>
                            updatePerson(
                                button
                                    .dataset
                                    .person
                            )
                    );
                }
            );
    }


    function currentStatusText(person) {
        let result =
            "Aktuell: " +
            (
                person.status ||
                "–"
            );


        if (person.text) {

            result +=
                " – " +
                person.text;
        }


        return result;
    }


    // ============================================================
    // Person aktualisieren
    // ============================================================

    async function updatePerson(id) {
        const person =
            people.get(id);


        if (!person) {
            return;
        }


        let status =
            document
                .getElementById(
                    "status-" + id
                )
                .value
                .trim();


        let text =
            document
                .getElementById(
                    "text-" + id
                )
                .value
                .trim();


        if (
            status.includes("|") ||
            text.includes("|")
        ) {

            setMessage(
                'Das Zeichen "|" kann nicht verwendet werden.',
                "error"
            );

            return;
        }


        status =
            status.replace(
                /[\r\n]+/g,
                " "
            );


        text =
            text.replace(
                /[\r\n]+/g,
                " "
            );


        status =
            normalizeGerman(status);

        text =
            normalizeGerman(text);


        const command =
            `SET|${id}|${status}|${text}`;


        try {

            setUpdateButtons(false);


            setMessage(
                "Sende Änderung …",
                "info"
            );


            await sendCommand(
                command
            );

        } catch (error) {

            handleCommandError(
                error
            );
        }
    }


    // ============================================================
    // Sonderzeichen
    // ============================================================

    function normalizeGerman(text) {
        return text

            .replaceAll("ä", "ae")
            .replaceAll("ö", "oe")
            .replaceAll("ü", "ue")
            .replaceAll("Ä", "Ae")
            .replaceAll("Ö", "Oe")
            .replaceAll("Ü", "Ue")
            .replaceAll("ß", "ss");
    }


    // ============================================================
    // Buttons / Fehler
    // ============================================================

    function setUpdateButtons(enabled) {
        document
            .querySelectorAll(
                ".update-button"
            )
            .forEach(
                button => {

                    button.disabled =
                        !enabled;
                }
            );
    }


    function handleCommandError(error) {
        console.error(error);


        setMessage(
            "Bluetooth-Fehler: " +
            error.message,
            "error"
        );


        setUpdateButtons(true);
    }


    function delay(ms) {
        return new Promise(
            resolve =>
                setTimeout(
                    resolve,
                    ms
                )
        );
    }


    // ============================================================
    // PWA Installation
    // ============================================================

    let deferredInstallPrompt =
        null;


    window.addEventListener(
        "beforeinstallprompt",
        event => {

            event.preventDefault();


            deferredInstallPrompt =
                event;


            installButton.style.display =
                "block";
        }
    );


    installButton.addEventListener(
        "click",
        async () => {

            if (!deferredInstallPrompt) {
                return;
            }


            deferredInstallPrompt.prompt();


            await deferredInstallPrompt
                .userChoice;


            deferredInstallPrompt =
                null;


            installButton.style.display =
                "none";
        }
    );


    window.addEventListener(
        "appinstalled",
        () => {

            installButton.style.display =
                "none";
        }
    );


    // ============================================================
    // Service Worker
    // ============================================================

    async function registerServiceWorker() {
        if (!("serviceWorker" in navigator)) {
            return;
        }


        try {

            await navigator.serviceWorker
                .register("./sw.js");


            console.log(
                "Service Worker registriert"
            );

        } catch (error) {

            console.error(
                "Service Worker Fehler:",
                error
            );
        }
    }


    // ============================================================
    // Start
    // ============================================================

    connectButton.addEventListener(
        "click",
        connect
    );


    window.addEventListener(
        "load",
        async () => {

            await registerServiceWorker();


            setMessage(
                "Bereit zum Verbinden.",
                "info"
            );
        }
    );

</script>

</body>
</html>
